<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WOW Together 티저</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="우리가 함께 일하는 방식이, 곧 찾아옵니다! 영상 보고 나의 WOW 타입도 알아보세요">
<meta property="og:type" content="website">
<meta property="og:title" content="WOW Together — 곧 찾아옵니다!">
<meta property="og:description" content="티저 보고, 나는 어떤 WOW 타입인지 알아보세요">
<meta property="og:image" content="https://kuhedu.github.io/wowtype/teaser/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://kuhedu.github.io/wowtype/teaser/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#eef0f4">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#eef0f4; --ink:#16181d; --sub:#5b6170; --line:#dfe2e8;
  --accent:#f25a2b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#f7f8fa 0%,var(--bg) 60%,#e7e9ef 100%);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:1040px}
.head{display:flex;flex-direction:column;align-items:center;margin:0 0 clamp(14px,2.4vw,24px)}
.head img{display:block;width:min(64vw,340px);height:auto}
.head span{margin-top:clamp(2px,.6vw,6px);font-size:clamp(13px,1.5vw,15px);font-weight:800;letter-spacing:.42em;padding-left:.42em;color:var(--ink)}
.stage{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:#e9ebf0 url(poster.jpg) center/cover no-repeat;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 50px -24px rgba(22,24,29,.35);
}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;display:block}
/* 시작 버튼 */
.play{
  position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:clamp(10px,2.2%,22px);
  background:transparent;border:0;cursor:pointer;transition:opacity .3s;
}
.play i{display:flex;align-items:center;justify-content:center;width:clamp(40px,6vw,60px);height:clamp(40px,6vw,60px);
  border-radius:50%;background:var(--ink);color:#fff;box-shadow:0 10px 24px -8px rgba(22,24,29,.55);transition:transform .2s}
.play i svg{width:42%;height:42%;margin-left:8%}
.play:hover i{transform:scale(1.08)}
.start{
  display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:clamp(16px,2.2vw,20px);
  padding:clamp(12px,1.6vw,16px) clamp(22px,2.6vw,30px) clamp(12px,1.6vw,16px) clamp(18px,2.2vw,24px);
  border-radius:999px;box-shadow:0 12px 30px -10px rgba(22,24,29,.6);
  transition:transform .2s;
}
.start{border:0;cursor:pointer}
.start:hover{transform:scale(1.04)}
.start svg{width:1.1em;height:1.1em}
.started .start,.started .skip,.counting .start{display:none}
.stage.started .play,.stage.counting .play{opacity:0;pointer-events:none}
/* 3초 카운트다운 */
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(238,240,244,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .35s;z-index:3;cursor:pointer}
.cd.off{opacity:0;pointer-events:none}
.cd .ring{position:relative;width:clamp(96px,16vw,150px);aspect-ratio:1}
.cd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:6}
.cd .bg{stroke:rgba(22,24,29,.12)}
.cd .fg{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:0;animation:sweep 3s linear forwards}
@keyframes sweep{to{stroke-dashoffset:289}}
.cd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,7vw,72px);font-weight:800;color:var(--ink)}
.cd b.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}
.cd small{position:absolute;left:0;right:0;bottom:clamp(12px,6%,36px);text-align:center;font-size:clamp(13px,1.6vw,16px);color:var(--sub);font-weight:600}
/* 소리 켜기(자동 재생이 소리 없이 시작됐을 때) */
.unmute{position:absolute;left:50%;top:clamp(10px,4%,24px);transform:translateX(-50%);z-index:4;display:none;align-items:center;gap:8px;
  background:var(--ink);color:#fff;border:0;font:inherit;font-weight:700;font-size:clamp(14px,1.8vw,17px);padding:10px 18px;border-radius:999px;cursor:pointer;
  box-shadow:0 10px 24px -8px rgba(22,24,29,.55);animation:pulse2 1.6s ease-out infinite}
.unmute.on{display:inline-flex}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(242,90,43,.5)}100%{box-shadow:0 0 0 14px rgba(242,90,43,0)}}
/* 끝나면 자동 이동 안내 */
.goov{display:none;flex-direction:column;align-items:center;gap:8px;margin:16px auto 0;width:min(100%,260px);
  color:var(--sub);font-weight:600;font-size:14px;text-align:center}
.goov.on{display:flex}
.goov i{display:block;width:100%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.goov i::after{content:"";display:block;height:100%;width:0;background:var(--accent)}
.goov.on i::after{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
/* 영상 속 '지금 테스트하기' 자리에 겹치는 진짜 버튼 */
.hot{
  position:absolute;left:7.6%;top:71.7%;width:29.4%;height:10.8%;
  border-radius:999px;display:none;cursor:pointer;
  animation:ring 1.6s ease-out infinite;
}
.stage.ended .hot{display:block}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,90,43,.55)}100%{box-shadow:0 0 0 18px rgba(242,90,43,0)}}
/* 아래 버튼 줄 */
.bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;min-height:64px;flex-wrap:wrap}
.go{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  background:var(--ink);color:#fff;font-weight:800;font-size:clamp(18px,2.4vw,22px);
  padding:18px 34px;border-radius:999px;
  box-shadow:0 14px 32px -12px rgba(22,24,29,.55);
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1);
}
.go>span{white-space:nowrap}
.go b{color:#ffb39a;font-weight:800}
.go svg{width:1em;height:1em;transition:transform .2s}
.go:hover svg{transform:translateX(4px)}
.bar:not(.ended-ui) .go{display:none}
.ended-ui .go{opacity:1;transform:none;pointer-events:auto;animation:rise .45s cubic-bezier(.2,.8,.2,1) both,pulse 2.4s ease-in-out .6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 14px 32px -12px rgba(22,24,29,.55)}50%{box-shadow:0 14px 32px -12px rgba(22,24,29,.55),0 0 0 8px rgba(242,90,43,.18)}}
.again{
  display:none;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);
  color:var(--sub);font:inherit;font-weight:600;font-size:15px;padding:14px 20px;border-radius:999px;cursor:pointer;
}
.again:hover{color:var(--ink);border-color:#c9ced8}
.again svg{width:1em;height:1em}
.ended-ui .again{display:inline-flex}
.skip{font-size:14px;color:var(--sub);text-decoration:none;border-bottom:1px solid transparent}
.skip:hover{color:var(--ink);border-color:currentColor}
.ended-ui .skip{display:none}
.bar{flex-direction:column}.bar .go{order:1}
.ended-ui{flex-direction:row}.bar .again{order:2}
.note{text-align:center;color:var(--sub);font-size:14px;margin-top:14px;min-height:20px}
@media (max-width:560px){
  .stage{border-radius:12px}
  .go{width:100%;justify-content:center;padding:18px 20px}
  .go .long{display:none}
  .again{width:100%;justify-content:center}
  .ended-ui{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.hot,.ended-ui .go{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="head"><img src="logo.png" alt="WOW together" width="1268" height="427"><span>TEASER</span></h1>
  <div class="stage counting" id="stage">
    <video id="v" src="teaser.mp4?v=2" poster="poster.jpg" preload="auto" playsinline webkit-playsinline></video>
    <button class="play" id="play" aria-label="티저 영상 재생 (소리 켜짐)">
      <i><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></i>
    </button>
    <div class="cd" id="cd" role="status" aria-live="polite">
      <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" cx="50" cy="50" r="46"/></svg><b id="cdn">3</b></div>
      <small>잠시 후 시작합니다 · 화면을 누르면 바로 시작</small>
    </div>
    <button class="unmute" id="unmute" type="button">🔊 눌러서 소리 켜기</button>
    <a class="hot" id="hot" href="https://kuhedu.github.io/wowtype/" aria-label="WOW 타입 테스트 하기"></a>
  </div>
  <div class="bar counting" id="bar">
    <button class="start" id="play2" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>티저 보기</button>
    <a class="go" id="go" href="https://kuhedu.github.io/wowtype/"><span><span class="long">나는 어떤 </span><b>WOW</b> 타입 테스트 하기</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <button class="again" id="again" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>다시 보기</button>
    <a class="skip" id="skip" href="https://kuhedu.github.io/wowtype/">영상 건너뛰고 바로 테스트 →</a>
  </div>
  <div class="goov" id="goov" role="status">곧 WOW 타입 테스트로 이동합니다<i></i></div>
  <p class="note" id="note">🔊 소리를 켜고 봐 주세요</p>
</main>
<script>
(function(){
  var v=document.getElementById('v'), stage=document.getElementById('stage'),
      bar=document.getElementById('bar'), note=document.getElementById('note');
  var cd=document.getElementById('cd'), cdn=document.getElementById('cdn'), um=document.getElementById('unmute'), timer=null;
  function stopCount(){ clearInterval(timer); timer=null; cd.classList.add('off'); bar.classList.remove('counting'); stage.classList.remove('counting'); }
  function start(){
    stopCount();
    stage.classList.add('started'); bar.classList.add('started'); stage.classList.remove('ended'); bar.classList.remove('ended-ui');
    v.controls=true; v.muted=false; um.classList.remove('on');
    var p=v.play();
    if(p&&p.catch) p.catch(function(){
      // 브라우저가 소리 있는 자동 재생을 막으면: 소리 없이 재생 + '소리 켜기' 버튼
      v.muted=true;
      v.play().then(function(){ um.classList.add('on'); }).catch(function(){
        // 소리 없는 재생도 막히면(저전력 모드 등): 재생 버튼으로 되돌림
        stage.classList.remove('started'); bar.classList.remove('started'); v.controls=false;
      });
    });
  }
  um.addEventListener('click',function(){ v.muted=false; um.classList.remove('on'); if(v.paused) v.play(); });
  v.addEventListener('volumechange',function(){ if(!v.muted) um.classList.remove('on'); });
  // 열자마자 3초 카운트다운 → 재생 (화면 누르면 바로 시작 — 누른 경우엔 소리도 확실히 켜짐)
  var n=3;
  timer=setInterval(function(){
    n--; if(n<=0){ start(); return; }
    cdn.textContent=n; cdn.classList.remove('pop'); void cdn.offsetWidth; cdn.classList.add('pop');
  },1000);
  cd.addEventListener('click',start);
  document.getElementById('play').addEventListener('click',start);
  document.getElementById('play2').addEventListener('click',start);
  var goov=document.getElementById('goov'), goT=null;
  document.getElementById('again').addEventListener('click',function(){ clearTimeout(goT); goov.classList.remove('on'); v.currentTime=0; start(); });
  v.addEventListener('ended',function(){
    // 전체화면에서 끝나면 빠져나와 버튼이 보이게
    try{ if(document.fullscreenElement) document.exitFullscreen(); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){}
    try{ if(v.webkitDisplayingFullscreen) v.webkitExitFullscreen(); }catch(e){}
    v.controls=false;
    stage.classList.add('ended'); bar.classList.add('ended-ui');
    note.textContent='';
    document.getElementById('go').focus({preventScroll:true});
    var r=bar.getBoundingClientRect(); if(r.bottom>innerHeight) bar.scrollIntoView({behavior:'smooth',block:'center'});
    // 끝나면 5초 뒤 테스트로 ('다시 보기' 누르면 취소)
    goov.classList.add('on');
    goT=setTimeout(function(){ location.href='https://kuhedu.github.io/wowtype/'; },5000);
  });
})();
</script>
</body>
</html>
